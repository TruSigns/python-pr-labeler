name: Auto-label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

# This is the part that trips people up: without pull-requests: write,
# the default GITHUB_TOKEN is read-only and label application fails silently
# from the script's perspective (you'll get a 403 from the API).
permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run labeler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python labeler.py
